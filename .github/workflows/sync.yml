# Nightly: pull fresh data from the wiki and redeploy if it changed.
name: sync
on:
  schedule: [{ cron: "30 21 * * *" }] # 21:30 UTC, after the Asia daily reset
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy even if the data did not change
        type: boolean
        default: false
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run sync
      - run: npm test
      - name: Commit data if changed
        id: diff
        run: |
          git config user.name "endfield-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/dataset.json; then echo "changed=false" >> $GITHUB_OUTPUT; exit 0; fi
          git add data/dataset.json && git commit -m "data: nightly sync" && git push
          echo "changed=true" >> $GITHUB_OUTPUT
      - if: steps.diff.outputs.changed == 'true' || inputs.deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
